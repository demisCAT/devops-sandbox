name: CI Pipeline

# When does this workflow run?
on:
  push:
    branches: [main]        # Runs on every push to main
  pull_request:
    branches: [main]        # Runs on every PR targeting main
  workflow_dispatch:         # Allows manual trigger from GitHub UI

# Environment variables available to all jobs
env:
  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
  IMAGE_NAME: ${{secrets.DOCKERHUB_USERNAME}}/devops-sandbox

jobs:
  # ──────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest    # GitHub provides a fresh Ubuntu VM for each run
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # This pulls your code onto the runner VM

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'        # Caches node_modules for faster runs

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint server.js --max-warnings 0 || true
        # We use || true so lint warnings don't fail the build during learning.
        # In production, remove || true.

  # ──────────────────────────────────────
  # Job 2: Test (depends on lint passing)
  # ──────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint               # Wait for lint to finish before starting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────
  # Job 3: Build & Push Docker image
  # ──────────────────────────────────────
  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test               # Wait for tests to pass before building
    # Only push to Docker Hub from the main branch (not from PRs)
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx is Docker's modern build engine — faster, supports caching

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
          # These secrets are stored in GitHub (see step 5.5)

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha    # Use GitHub Actions cache
          cache-to: type=gha,mode=max
